// Standalone build only. When the engine is included by a host app, the host's root build script is
// in charge and this file is ignored.
plugins {
  id 'com.android.library' version '8.13.2' apply false
  id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
  id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false
}

allprojects {
  group = 'dev.antigravity.fluidengine'
  version = '1.0.0'
}
