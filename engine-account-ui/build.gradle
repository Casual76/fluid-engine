// F10.4 · La faccia dell'Account Pampa in ogni app, di base e senza grafica finale (fasi F10.4): la riga «Account
// Pampa» per le impostazioni, l'avatar con le iniziali, e i quattro stati di `PampaAccount` (`NoStore`, `StoreTooOld`,
// `SignedOut`, `SignedIn`, architettura § 2.4), coi componenti di vetro che l'engine ha gia'. Opt-in.
//
//   implementation project(':engine-account-ui')
//
// Nessuna chiave e nessuna crittografia (progetto, T10): i componenti delle persone (`FluidPeopleRow`, «Da X»…) arrivano
// in F10.6, la grafica finale in F10.11.
plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace = 'dev.antigravity.fluidengine.account.ui'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  buildFeatures {
    compose = true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  api project(':engine-ui')
  api project(':engine-account')

  testImplementation "junit:junit:${engine.junit}"
}
