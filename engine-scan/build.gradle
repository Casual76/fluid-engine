// F8.17 · Lo scanner di documenti (`scanner-documenti`), come la scansione di Note e File di iOS (VisionKit): la
// fotocamera di vetro che trova i bordi del foglio dal vivo e scatta quando e' fermo, il raddrizzamento e i filtri
// («Documento», grigi, bianco e nero, foto), la fila delle pagine da riordinare e ritagliare, e il PDF o le immagini
// consegnati per URI. Opt-in:
//
//   implementation project(':engine-scan')
//
// Una sola libreria: CameraX (Apache-2.0). I bordi (Hough sui bordi di Canny e la macchia di Otsu), la prospettiva, i
// filtri e il PDF sono codice dell'engine: niente OpenCV, che peserebbe decine di MB. Il permesso CAMERA **non** lo
// dichiara il modulo: lo dichiara l'app che usa la fotocamera vera (la scheda del modulo dice la riga). La galleria
// Fluid Glass usa la sorgente finta e non chiede la fotocamera.
//
// CameraX 1.6 chiede compileSdk 36 e AGP 8.9.1 all'app ospite (metadati dell'AAR, letti il 25/11/2026) e porta con se'
// kotlinx-coroutines 1.9.0.
plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace = 'dev.antigravity.fluidengine.scan'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  buildFeatures {
    compose = true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }

  testOptions {
    unitTests {
      // Lo scanner e il PDF si provano sulle bitmap vere di Android (Robolectric, grafica nativa).
      includeAndroidResources = true
    }
  }

  // F8.17d: le foto di prova dei fogli stanno nel nucleo (engine-scan-core), che prova i bordi; la fotocamera finta
  // delle prove dello scanner usa le stesse.
  sourceSets {
    test {
      resources.srcDirs += ['../engine-scan-core/src/test/resources']
    }
  }
}

dependencies {
  // `api`: lo scanner parla FluidScanState, i vetri e le parole di engine-ui.
  api project(':engine-ui')
  // F8.17d: i bordi, la geometria, il raddrizzamento e i filtri stanno nel nucleo senza fotocamera (li usa anche
  // engine-viewer-ocr). `api`: FluidScanQuad, FluidScanFilter e il resto sono parte dell'API dello scanner.
  api project(':engine-scan-core')
  implementation "androidx.camera:camera-core:${engine.camerax}"
  implementation "androidx.camera:camera-camera2:${engine.camerax}"
  implementation "androidx.camera:camera-lifecycle:${engine.camerax}"
  implementation "androidx.camera:camera-view:${engine.camerax}"

  testImplementation "junit:junit:${engine.junit}"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${engine.coroutinesTest}"
  testImplementation "org.robolectric:robolectric:${engine.robolectric}"
  testImplementation "androidx.test:core:1.7.0"
  testImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  testImplementation 'androidx.compose.ui:ui-test-junit4'
  debugImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
