plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace 'dev.antigravity.fluidengine.ui'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  buildFeatures {
    compose true
  }

  testOptions {
    unitTests {
      // I test restano logica pura, ma il piano di resa di Fluid-physics porta con sé un
      // `Path` di Compose: sul JVM i metodi android.graphics non esistono, e qui devono solo
      // non esplodere — nessun test asserisce sui contenuti di un Path.
      returnDefaultValues = true
    }
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  api project(':engine-foundation')

  api platform("androidx.compose:compose-bom:${engine.composeBom}")
  api 'androidx.compose.ui:ui'
  api 'androidx.compose.foundation:foundation'
  api 'androidx.compose.runtime:runtime'
  api 'androidx.compose.animation:animation'
  // Material 3 is pinned to its own alpha rather than taken from the BOM: the expressive motion
  // scheme the theme installs does not exist in the stable line yet.
  api "androidx.compose.material3:material3:${engine.material3}"
  api 'androidx.compose.material:material-icons-extended'
  api "androidx.core:core-ktx:${engine.coreKtx}"
  api "androidx.lifecycle:lifecycle-runtime-compose:${engine.lifecycle}"
  // FluidNavHost usa androidx.lifecycle.viewmodel.compose in prima persona (LocalViewModelStoreOwner). Senza una
  // dichiarazione sua la prende da navigation-compose, che la porta con i metadati della 2.9.0: la dichiariamo
  // alla stessa versione del resto del lifecycle, come la riga sopra.
  api "androidx.lifecycle:lifecycle-viewmodel-compose:${engine.lifecycle}"
  // Serve per BackHandler e PredictiveBackHandler: il modale in-root vive dentro la composizione
  // dell'app, quindi il tasto indietro non gli arriva da solo come farebbe con un Dialog.
  api "androidx.activity:activity-compose:${engine.activityCompose}"
  // FluidNavHost (3.0, fase 8): il NavController resta quello di navigation, il movimento e' nostro.
  // `api` perche' le app parlano NavHostController e NavGraphBuilder, e la versione e' quella che
  // hanno gia' tutte (engine.navigation), cosi' l'engine non ne trascina una seconda.
  api "androidx.navigation:navigation-compose:${engine.navigation}"
  // Il motore di corrispondenza dei vertici dietro Fluid-physics. `implementation` di proposito:
  // l'API pubblica parla solo FluidForm, cosi' la dipendenza puo' cambiare senza rompere le app.
  implementation "androidx.graphics:graphics-shapes:${engine.graphicsShapes}"
  implementation "androidx.webkit:webkit:${engine.webkit}"

  testImplementation "junit:junit:${engine.junit}"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${engine.coroutinesTest}"
}
