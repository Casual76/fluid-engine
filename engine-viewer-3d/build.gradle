plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace = 'dev.antigravity.fluidengine.viewer.scene'
  compileSdk engine.compileSdk
  defaultConfig {
    minSdk engine.minSdk
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildFeatures { compose = true }
  sourceSets.test.resources.srcDir "src/androidTest/assets"
  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }
  kotlinOptions { jvmTarget = engine.jvmTarget }
}

dependencies {
  api project(':engine-viewer')
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${engine.coroutines}"
  testImplementation "junit:junit:${engine.junit}"
  testImplementation "org.robolectric:robolectric:${engine.robolectric}"
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation "androidx.activity:activity-compose:${engine.activityCompose}"
  api 'com.google.android.filament:filament-android:1.71.5'
  api 'com.google.android.filament:gltfio-android:1.71.5'
  implementation 'com.google.android.filament:filament-utils-android:1.71.5'
}
