plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace = 'dev.antigravity.fluidengine.viewer.graphics'
  compileSdk engine.compileSdk
  defaultConfig {
    minSdk engine.minSdk
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildFeatures { compose = true }
  sourceSets.test.resources.srcDir "src/androidTest/assets"
  // F6C.20: la prova di «•••» compone il provino nel visore vero, con le risorse di engine-ui.
  testOptions.unitTests.includeAndroidResources = true
  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }
  kotlinOptions { jvmTarget = engine.jvmTarget }
}

dependencies {
  api project(':engine-viewer')
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${engine.coroutines}"
  testImplementation "junit:junit:${engine.junit}"
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  androidTestImplementation "androidx.activity:activity-compose:${engine.activityCompose}"
  implementation 'com.caverock:androidsvg-aar:1.4'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  testImplementation "org.robolectric:robolectric:${engine.robolectric}"
  testImplementation 'androidx.compose.ui:ui-test-junit4'
}
