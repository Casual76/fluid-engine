plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace = 'dev.antigravity.fluidengine.widget'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  buildFeatures {
    compose = true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }

  testOptions {
    unitTests {
      // F8.6: il quadrante del widget si prova in Robolectric (le maschere si disegnano davvero, Glance compone).
      includeAndroidResources = true
    }
  }
}

dependencies {
  api project(':engine-foundation')
  // The widget palette is derived from the same colour scheme the app renders, which is why this is
  // a dependency on the design system rather than a second copy of its colours.
  api project(':engine-ui')

  api "androidx.glance:glance:${engine.glance}"
  api "androidx.glance:glance-appwidget:${engine.glance}"

  testImplementation "junit:junit:${engine.junit}"
  // F8.6: il quadrante del widget, composto da Glance e disegnato nelle maschere.
  testImplementation "org.robolectric:robolectric:${engine.robolectric}"
  testImplementation "androidx.glance:glance-appwidget-testing:${engine.glance}"
  // F8.25: la vetrina dei widget e' Compose (l'anteprima, il tasto, l'esito): un dito finto su un albero vero.
  testImplementation "androidx.test:core:1.7.0"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${engine.coroutinesTest}"
  testImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  testImplementation 'androidx.compose.ui:ui-test-junit4'
  debugImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
