plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

android {
  namespace 'dev.antigravity.fluidengine.widget'
  compileSdk engine.compileSdk

  defaultConfig {
    minSdk engine.minSdk
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  api project(':engine-foundation')
  // The widget palette is derived from the same colour scheme the app renders, which is why this is
  // a dependency on the design system rather than a second copy of its colours.
  api project(':engine-ui')

  api "androidx.glance:glance:${engine.glance}"
  api "androidx.glance:glance-appwidget:${engine.glance}"

  testImplementation "junit:junit:${engine.junit}"
}
