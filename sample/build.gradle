// Fluid Glass.
//
// Nata come galleria interna — come un cambiamento al design system viene *guardato* prima di
// arrivare in cinque app — e ancora quello. Ma dalla 1.0.0 è anche un'app del Pampa Store: la
// scheda Playground è l'unico posto al mondo dove Fluid-physics si prova con le dita, e un motore
// che trasforma il vetro merita di essere installabile.
//
// Si compila solo quando l'engine è aperto da solo: un'app ospite include i moduli engine-* e non
// legge mai il settings.gradle dell'engine.
plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

def viewerMedia3 = project.findProperty('viewer.media3Test') ?: engine.media3Test

// La chiave vera vive fuori dal repo: local.properties (git-ignorato) con
//   pampa.storeFile=C\:/VibeCoded Projects/pampa.jks   (i due punti si scrivono \: anche con le barre dritte: lint PropertyEscape)
//   pampa.storePassword=...
//   pampa.keyAlias=pampa
//   pampa.keyPassword=...
// Senza chiave la release ripiega sulla firma di debug e lo dice: si continua a compilare ovunque,
// ma quella build non è pubblicabile e non si installa sopra una installazione vera.
def keystoreProps = new Properties()
def localPropsFile = new File(project.projectDir.parentFile, 'local.properties')
if (localPropsFile.exists()) {
  localPropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystoreProps.getProperty('pampa.storeFile') != null

android {
  namespace = 'dev.antigravity.fluidengine.sample'
  compileSdk engine.compileSdk

  defaultConfig {
    // L'id vero dell'app pubblicata. Il namespace Kotlin resta `...fluidengine.sample`: cambiare
    // i package non fa l'app più vera, cambiare l'id sì.
    applicationId 'dev.antigravity.fluidglass'
    minSdk engine.minSdk
    targetSdk engine.compileSdk
    // Sopra il numero della 1.0.4 stabile (6): una beta che si installa sopra la stabile deve averne
    // uno più alto, o Android la rifiuta come retrocessione.
    versionCode 12
    // Letterale, non `engine.version`: l'app ha la sua vita (il motore è alla 1.9.x mentre questa
    // è alla 1.0.x), e il publisher dello store legge questa riga con una regex che capisce solo
    // stringhe.
    //
    // 2.0.0-beta.1: la prima beta della 3.0 dell'engine (tasti e aptica come LibrePods, menu e pannelli a
    // un materiale, pagine, componenti nuovi). Il suffisso `-beta` sta prima della stabile 2.0.0 per
    // `compareVersions`, e `isStableVersionNewer` non offre mai una pre-release: l'aggiornamento in-app
    // della beta non propone la 1.0.4 come novità. Il manifest.json non si tocca finché la beta non si
    // pubblica.
    versionName '2.0.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    // Gli extra di lancio (`gallery.page`, `plane.scene`, `gallery.tune`...) e la diagnostica li ammette, oltre alla
    // build `debuggable`, anche la `bench` (vedi sotto). Falso di serie: la release dello store non ha scorciatoie, e
    // la build di debug non ne ha bisogno (e' gia' `debuggable`, e i test provano proprio quel flag).
    buildConfigField 'boolean', 'EXTRAS_WITHOUT_DEBUGGABLE', 'false'
  }

  signingConfigs {
    if (hasReleaseKey) {
      release {
        storeFile file(keystoreProps.getProperty('pampa.storeFile'))
        storePassword keystoreProps.getProperty('pampa.storePassword')
        keyAlias keystoreProps.getProperty('pampa.keyAlias', 'pampa')
        keyPassword keystoreProps.getProperty('pampa.keyPassword')
        // La v1 va accesa a mano: AGP la toglie con minSdk >= 24, e il publisher dello store
        // convalida proprio la presenza della firma JAR (META-INF/*.RSA) prima di caricare.
        enableV1Signing = true
        enableV2Signing = true
        enableV3Signing = true
      }
    }
  }

  buildTypes {
    debug {
      // Un suffisso, così una build di lavoro convive sul telefono con quella dello store.
      applicationIdSuffix '.debug'
      minifyEnabled false
    }
    release {
      minifyEnabled true
      shrinkResources = true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (hasReleaseKey) {
        signingConfig = signingConfigs.release
      } else {
        signingConfig signingConfigs.debug
        println 'Fluid Glass: nessuna chiave in local.properties — release firmata DEBUG, non pubblicabile.'
      }
    }
    // La build «bench»: come la release (R8, risorse ridotte, non debuggable: Compose e ART si comportano come per
    // gli utenti), ma installabile accanto alla galleria dello store e a quella di debug, guidabile dagli extra di
    // lancio e profilabile da shell. Serve alle misure di fluidita' e di costo sul tablet: in debug (ART debuggable,
    // niente R8) i fotogrammi lunghi sono in parte un artefatto della build. NON si pubblica mai.
    //
    // Dichiarata dopo `release`: `initWith` copia da quella com'e' a questo punto.
    bench {
      initWith release
      // `initWith` copia anche la firma, e con la chiave in local.properties sarebbe quella dello store: mai. La bench
      // e' firmata di debug sempre, e per questo non si installa sopra la vera (id diverso, firma diversa).
      signingConfig = signingConfigs.debug
      applicationIdSuffix '.bench'
      debuggable = false
      // I moduli dell'engine hanno solo debug e release: la bench prende la release (con R8 sul consumatore).
      matchingFallbacks = ['release']
      // Gli extra e la diagnostica della galleria valgono anche qui (un solo punto che li legge: `isDebuggableApp()`).
      buildConfigField 'boolean', 'EXTRAS_WITHOUT_DEBUGGABLE', 'true'
    }
  }

  buildFeatures {
    compose = true
    buildConfig = true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }

  sourceSets {
    // La pagina e' in main: il catalogo si compila qui, mai nel main di engine-ui.
    main.java.srcDir project(':engine-ui').file('src/robustness/kotlin')
  }

  testOptions {
    unitTests {
      // Robolectric legge manifest e risorse dell'app (i font del tema, l'attivita' di prova).
      includeAndroidResources = true
      // F7.24 · La memoria delle prove: con i 512 MB di serie di Gradle le 1 831 prove del sample in una JVM sola
      // finivano la memoria (`F8p15CapturesTest`, OutOfMemoryError nel lotto). Misurato il 26/11 (tutte le 1 834–1 838
      // prove, `--rerun`): 1536 MB in una JVM sola 24,4 min, verde; 1024 MB con una JVM nuova ogni 80 classi 24,0 min,
      // verde. Si tiene la seconda: lo stesso tempo, e la memoria di una JVM non cresce col numero delle prove.
      // Le proprieta' servono a misurare senza toccare il file: `-PsampleTestHeap=…`, `-PsampleTestForkEvery=…`
      // (0 = una JVM sola).
      all { test ->
        test.maxHeapSize = project.findProperty('sampleTestHeap') ?: '1024m'
        def every = (project.findProperty('sampleTestForkEvery') ?: '80') as long
        if (every > 0) test.forkEvery = every
      }
    }
  }
}

// F8.17 · engine-viewer-ocr porta Tesseract coi jar di bytedeco, che hanno anche le intestazioni C e un eseguibile:
// nell'APK non servono (la scheda del modulo dice la stessa riga per le app).
android {
  packaging {
    resources {
      excludes += ['lib/*/include/**', 'lib/*/tesseract', 'META-INF/native-image/**']
    }
  }
}

// F6C.15 · La pagina «Pesi» della galleria legge la lista ammessa dei moduli dei visori, la stessa che leggono
// checkViewerFamilies e tools/engine-install.ps1: la si copia negli asset a ogni build, mai una copia scritta a mano.
// F8.22 · La libreria nativa del modello del significato (LiteRT-LM: 22 MB in arm64-v8a e 26 MB in x86_64, non compressi)
// entra solo nella build di debug, dove la scena «Per significato» la prova col modello copiato a mano. Fluid Glass
// pubblicata e la bench restano leggere (+48,7 MB misurati nella bench con la libreria): la scena lo dice, e la ricerca
// va per parole. E' la domanda 5 di F8.22.
androidComponents {
  onVariants(selector().withBuildType('release')) { variant -> variant.packaging.jniLibs.excludes.add('**/liblitertlm_jni.so') }
  onVariants(selector().withBuildType('bench')) { variant -> variant.packaging.jniLibs.excludes.add('**/liblitertlm_jni.so') }
}

def visoriFamiliesAssets = layout.buildDirectory.dir('generated/visori-families/assets')
def copyVisoriFamilies = tasks.register('copyVisoriFamilies', Copy) {
  from(rootProject.file('engine-viewer/families.json'))
  into(visoriFamiliesAssets.map { it.dir('visori') })
}
android.sourceSets.main.assets.srcDir(visoriFamiliesAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn copyVisoriFamilies }

dependencies {
  implementation project(':engine-ui')
  // L'aggiornamento in-app: lo stesso manifest.json che il Pampa Store legge, una sola fonte.
  implementation project(':engine-update')
  // F8.11: la memoria della prima volta (il benvenuto visto, i permessi chiesti) nel file dell'engine.
  implementation project(':engine-storage')
  // F8.23: la cassaforte e il blocco con l'impronta (opt-in), per le scene della pagina «Elementi nuovi».
  implementation project(':engine-vault')
  implementation project(':engine-security')
  // L'editor con formattazione (opt-in): la galleria lo mostra, quindi lo include. Un'app che non lo
  // chiede a engine-install.ps1 non lo vede nemmeno.
  implementation project(':engine-richtext')
  // L'interfaccia dell'assistente (F3.2b): la pagina «Assistente» ne mostra le superfici con dati finti. Non chiede
  // chiavi, rete o servizi all'avvio. `implementation` e non `debugImplementation`: la pagina sta in src/main con le
  // altre. Porta con se' il permesso RECORD_AUDIO di engine-ai, che la galleria non chiede mai (il composer della pagina
  // ha requestMicPermission = false).
  implementation project(':engine-ai-ui')
  implementation "androidx.media3:media3-exoplayer:${viewerMedia3}"
  implementation project(':engine-viewer') // F6C.4, opt-in: i decodificatori dei visori (PDF, testo, GIF e WebP animate) per la galleria
  // F6C.15 · Il visore universale, come lo includerebbe Universal Converter: engine-viewer e tutte le famiglie, che si
  // registrano da sole. Senza engine-viewer-ar: chiede la fotocamera, e Fluid Glass e' un'app pubblicata che non la
  // chiede (checkArViewerManifests controlla che CAMERA non arrivi nel suo APK). Il tasto «AR» si prova nell'APK di prova
  // del modulo (F6C.16).
  implementation(project(':engine-viewer-all')) {
    exclude module: 'engine-viewer-ar'
  }
  implementation "androidx.activity:activity-compose:${engine.activityCompose}"
  // F8.21 · La sincronizzazione (engine-sync) e la scelta tra versioni (engine-revisions): la pagina «Elementi nuovi» li
  // mostra con dispositivi finti in memoria, senza rete e senza lavoro in sottofondo.
  implementation project(':engine-sync')
  implementation project(':engine-revisions')
  // F8.10 · La condivisione: «Mostra come QR» nel foglio (engine-qr) e gli arrivi da altre app (engine-share-in), che
  // la galleria mostra nella pagina «Elementi nuovi» e riceve con la sua attivita' degli arrivi.
  implementation project(':engine-qr')
  implementation project(':engine-share-in')
  // F8.19 · Notifiche, promemoria e attività fuori dall'app: le scene usano engine-notify vero (le notifiche e gli allarmi
  // di Android). Si installa solo quando si apre una scena: il primo fotogramma non cambia.
  implementation project(':engine-notify')
  // F8.20 · Il centro trasferimenti (con engine-net e WorkManager): la scena scarica e carica davvero, da un server sul
  // loopback della galleria o da quello del PC (`adb reverse`). WorkManager parte su richiesta (`GalleryApplication`).
  implementation project(':engine-transfer')
  // F8.18 · Lo sfoglia-file (engine-files, sopra engine-viewer): la scena sfoglia la cartella della galleria e le
  // cartelle concesse col selettore di sistema, e apre i file nei visori dalla miniatura.
  implementation project(':engine-files')
  // F8.14 · Foto e allegati: il selettore di foto e video e il pannello degli allegati, con sorgenti finte.
  implementation project(':engine-media')
  // F8.13 · Audio: il registratore (engine-audio, col microfono vero), la riproduzione di sistema (engine-playback, con
  // Media3 della galleria: la stessa versione dei visori) e l'ascolto dal paragrafo (engine-transcript). Il servizio di
  // riproduzione parte solo quando si apre una scena audio: il primo fotogramma non cambia.
  implementation project(':engine-audio')
  implementation project(':engine-playback')
  implementation project(':engine-transcript')
  implementation "androidx.media3:media3-session:${viewerMedia3}"
  // F8.16 · Il disegno e le annotazioni (engine-ink, sopra androidx.ink): lo schizzo, la foto e il PDF annotati, la firma.
  implementation project(':engine-ink')
  // F8.22 · Ricerca: l'indice sul telefono e «Cerca in Pampa» (engine-search, col ponte firmato), e il modello del
  // significato con LiteRT-LM (engine-search-semantic). Il modello (157 MB) non entra nell'APK: la scena lo legge dalla
  // cartella dell'app se c'e'. La libreria nativa di LiteRT-LM si' (la misura e' nel rapporto di F8.22).
  implementation project(':engine-search')
  implementation project(':engine-search-semantic')
  // F8.15 · Modifica delle immagini: l'editor delle foto (ritaglia e regola), lo strumento del visore e la tendina.
  implementation project(':engine-editor')
  // F8.17 · Lo scanner di documenti con la fotocamera finta (la galleria non chiede CAMERA) e «Leggi testo», che arriva
  // con engine-viewer-all (la famiglia engine-viewer-ocr).
  implementation project(':engine-scan')
  // F8.25 · La vetrina dei widget (engine-widget, con due widget Glance della galleria), le Tile e le complicazioni
  // (engine-wear, solo per disegnarle nella scena: la galleria non e' un'app dell'orologio) e il ponte con la ricevuta
  // (engine-wear-sync, in memoria). Il renderer delle Tile e' quello del sistema dell'orologio, qui per mostrarle vere.
  implementation project(':engine-widget')
  implementation project(':engine-wear')
  implementation project(':engine-wear-sync')
  implementation "androidx.wear.tiles:tiles-renderer:${engine.wearTiles}"
  // F8.26: la mappa (MapLibre, le tessere di OpenFreeMap nella debug e nella bench) e la salute (Health Connect, solo dati finti nella galleria).
  implementation project(':engine-map')
  implementation project(':engine-health')
  // F8.24 · La diagnostica (engine-diagnostics: il consenso, la coda, i fotogrammi per pagina, le tracce di debug) e «Segnala
  // un problema» (engine-feedback). La diagnostica si accende solo quando si apre una sua scena: il primo fotogramma della
  // galleria non cambia, e niente parte senza il si' (e solo verso il PC, `adb reverse tcp:8787 tcp:8787`).
  implementation project(':engine-diagnostics')
  implementation project(':engine-feedback')

  // I test Compose dei controlli (2.11.0): un dito finto su un vero albero Compose, sul computer.
  // Stanno qui e non in engine-ui di proposito: un'app ospite include engine-ui ed esegue i suoi
  // test, e avrebbe dovuto scaricare Robolectric e un'immagine di Android per un controllo che
  // non e' suo. Il sample esiste solo nel build dell'engine, e nessuna app lo vede mai.
  //
  // Solo sul debug (src/testDebug): Robolectric cerca l'attivita' vuota dei test nel manifest
  // dell'app, quindi ui-test-manifest deve entrare nell'APK — in quello di debug, che ha il suo
  // suffisso, e mai in quello pubblicato sullo store.
  debugImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
  testDebugImplementation "junit:junit:${engine.junit}"
  testDebugImplementation "org.robolectric:robolectric:${engine.robolectric}"
  // Il cancello dell'ospite di engine-ai-bridge (la firma di chi chiama) ha bisogno di Binder e di un
  // PackageManager: lo si prova qui, con Robolectric, e solo nei test (mai nell'APK della galleria).
  testDebugImplementation project(':engine-ai-bridge')
  // F10.8: due app finte e uno Store finto nello stesso processo, col FluidTheme vero (F10p8SharedThemeTest). Solo nei
  // test: la galleria non usa l'account.
  testDebugImplementation project(':engine-account-host')
  testDebugImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  testDebugImplementation 'androidx.compose.ui:ui-test-junit4'
  androidTestImplementation platform("androidx.compose:compose-bom:${engine.composeBom}")
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
  // API 37 ha rimosso InputManager.getInstance: Espresso precedente fallisce prima dei test.
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
  androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  androidTestImplementation "androidx.webkit:webkit:${engine.webkit}"
}
