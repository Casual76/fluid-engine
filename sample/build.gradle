// Fluid Glass.
//
// Nata come galleria interna — come un cambiamento al design system viene *guardato* prima di
// arrivare in cinque app — e ancora quello. Ma dalla 1.0.0 è anche un'app del Pampa Store: la
// scheda Playground è l'unico posto al mondo dove Fluid-physics si prova con le dita, e un motore
// che trasforma il vetro merita di essere installabile.
//
// Si compila solo quando l'engine è aperto da solo: un'app ospite include i moduli engine-* e non
// legge mai il settings.gradle dell'engine.
plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

apply from: "${projectDir}/../versions.gradle"

// La chiave vera vive fuori dal repo: local.properties (git-ignorato) con
//   pampa.storeFile=C:/VibeCoded Projects/pampa.jks
//   pampa.storePassword=...
//   pampa.keyAlias=pampa
//   pampa.keyPassword=...
// Senza chiave la release ripiega sulla firma di debug e lo dice: si continua a compilare ovunque,
// ma quella build non è pubblicabile e non si installa sopra una installazione vera.
def keystoreProps = new Properties()
def localPropsFile = new File(project.projectDir.parentFile, 'local.properties')
if (localPropsFile.exists()) {
  localPropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystoreProps.getProperty('pampa.storeFile') != null

android {
  namespace 'dev.antigravity.fluidengine.sample'
  compileSdk engine.compileSdk

  defaultConfig {
    // L'id vero dell'app pubblicata. Il namespace Kotlin resta `...fluidengine.sample`: cambiare
    // i package non fa l'app più vera, cambiare l'id sì.
    applicationId 'dev.antigravity.fluidglass'
    minSdk engine.minSdk
    targetSdk engine.compileSdk
    versionCode 6
    // Letterale, non `engine.version`: l'app ha la sua vita (il motore è alla 1.9.x mentre questa
    // è alla 1.0.x), e il publisher dello store legge questa riga con una regex che capisce solo
    // stringhe.
    versionName '1.0.4'
  }

  signingConfigs {
    if (hasReleaseKey) {
      release {
        storeFile file(keystoreProps.getProperty('pampa.storeFile'))
        storePassword keystoreProps.getProperty('pampa.storePassword')
        keyAlias keystoreProps.getProperty('pampa.keyAlias', 'pampa')
        keyPassword keystoreProps.getProperty('pampa.keyPassword')
        // La v1 va accesa a mano: AGP la toglie con minSdk >= 24, e il publisher dello store
        // convalida proprio la presenza della firma JAR (META-INF/*.RSA) prima di caricare.
        enableV1Signing true
        enableV2Signing true
        enableV3Signing true
      }
    }
  }

  buildTypes {
    debug {
      // Un suffisso, così una build di lavoro convive sul telefono con quella dello store.
      applicationIdSuffix '.debug'
      minifyEnabled false
    }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (hasReleaseKey) {
        signingConfig signingConfigs.release
      } else {
        signingConfig signingConfigs.debug
        println 'Fluid Glass: nessuna chiave in local.properties — release firmata DEBUG, non pubblicabile.'
      }
    }
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility engine.javaVersion
    targetCompatibility engine.javaVersion
  }

  kotlinOptions {
    jvmTarget = engine.jvmTarget
  }
}

dependencies {
  implementation project(':engine-ui')
  // L'aggiornamento in-app: lo stesso manifest.json che il Pampa Store legge, una sola fonte.
  implementation project(':engine-update')
  implementation "androidx.activity:activity-compose:${engine.activityCompose}"
}
