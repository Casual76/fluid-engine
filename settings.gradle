// Only used when the engine is opened on its own — to build it, run its tests, or cut a release.
// A host app includes the module directories directly (see tools/engine-install.ps1), and then this
// file is not read at all.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = "fluid-engine"

// The paths are flat on purpose: a host app includes the same modules under the same names, so a
// `project(':engine-ui')` dependency resolves identically in both builds.
include ':engine-foundation'
include ':engine-ui'
include ':engine-storage'
include ':engine-net'
include ':engine-config'
include ':engine-update'
include ':engine-widget'
include ':engine-wear'
include ':engine-ai'
include ':engine-ai-bridge'
include ':engine-ai-ui'
include ':engine-richtext'
include ':engine-viewer'
include ':engine-viewer-archive'
include ':engine-viewer-office'
// F6C.8 · Il visore universale: engine-viewer piu' tutte le famiglie dei visori. Le famiglie (engine-viewer-office,
// -archive, -data, -graphics, -3d) entrano qui con una riga ciascuna, quando esistono.
include ':engine-viewer-all'
include ':engine-viewer-graphics', ':engine-viewer-3d'
include ':engine-viewer-ar'
include ':engine-viewer-data' // F6C.13 · testi ricchi e dati
// F8.21 · Sincronizzazione: il motore (registro, unione, invio una volta sola) e il foglio della scelta tra versioni.
// Opt-in tutti e due, e indipendenti: Notes usa il foglio con la sua sincronizzazione.
include ':engine-sync'
include ':engine-revisions'
// F10.2 · Le passkey e il gestore delle password (engine-auth), e Google a parte (engine-auth-google): opt-in.
include ':engine-auth'
include ':engine-auth-google'
// F10.2 · «Pampa · prova passkey»: l'app che prova il PRF sul telefono, firmata con una chiave di prova (non pampa.jks).
// Solo nel build dell'engine, fuori dal lotto standard: tools/prf-probe/README.md.
include ':prf-probe'
project(':prf-probe').projectDir = file('tools/prf-probe')
// F8.23 · La cassaforte (senza interfaccia) e il blocco con l'impronta (lo schermo di vetro e il dialogo di sistema).
include ':engine-vault'
include ':engine-security'
// F8.10 · Condivisione: il QR del foglio (ZXing core) e gli arrivi da altre app. Opt-in tutti e due.
include ':engine-qr'
include ':engine-share-in'
// F8.19 · Notifiche, promemoria e attività fuori dall'app (Live Update di Android 16). Opt-in, senza interfaccia: le pagine
// e il ponte con la pillola di attività stanno in engine-ui.
include ':engine-notify'
// F10.4 · L'Account Pampa: quello che vede ogni app (mai rete), il motore dentro Pampa Store (custodia delle chiavi,
// provider firmato) e la riga «Account Pampa». Opt-in tutti e tre.
include ':engine-account'
include ':engine-account-host'
include ':engine-account-ui'
// F10.6 · Le persone sul telefono (engine-people: la crittografia di Codex, la persona, la casella, gli spazi) e il campanello
// di FCM solo per Pampa Store (engine-push-fcm). Opt-in tutti e due.
include ':engine-people'
include ':engine-push-fcm'
// F8.20 · Il centro trasferimenti: la coda persistita degli scaricamenti e dei caricamenti lunghi, sopra engine-net e
// WorkManager. Opt-in; la pagina «Trasferimenti» e la pillola stanno in engine-ui.
include ':engine-transfer'
// F8.18 · Lo sfoglia-file (engine-files): le posizioni, le cartelle in griglia o in elenco, la ricerca, i recenti e
// l'apertura nei visori dalla miniatura. Opt-in, sopra engine-viewer.
include ':engine-files'
// F8.14 · Foto e allegati: il selettore di foto e video di vetro (con il contratto delle sorgenti: il telefono, MyCloud
// Gallery in F12, un archivio futuro) e il pannello degli allegati. Opt-in.
include ':engine-media'
// F8.13 · Audio: la cattura del registratore (engine-audio), la riproduzione di sistema con Media3 (engine-playback) e
// l'ascolto dal paragrafo (engine-transcript). Opt-in tutti e tre; l'onda e il pannello del registratore stanno in engine-ui.
include ':engine-audio'
include ':engine-playback'
include ':engine-transcript'

// F6C.8 · Il modulo di famiglia di prova e l'app che lo prova in release (R8): solo nel build dell'engine.
include ':engine-viewer-prova'
project(':engine-viewer-prova').projectDir = file('engine-viewer/prova/famiglia')
include ':engine-viewer-prova-app'
project(':engine-viewer-prova-app').projectDir = file('engine-viewer/prova/app')
// F10.4 · L'app di prova della custodia col Keystore vero, per la finestra sul tablet: solo nel build dell'engine.
include ':engine-account-prova'
project(':engine-account-prova').projectDir = file('engine-account-host/prova')
// F10.8 · Le app di prova del tema comune (uno Store finto e due app finte con le icone), per la finestra sul tablet:
// solo nel build dell'engine.
include ':engine-account-prova-tema'
project(':engine-account-prova-tema').projectDir = file('engine-account-host/prova-tema')
// F10.6 · Le due app di prova del campanello delle persone (lo «Store» e l'app che riceve), per il tablet: solo qui.
include ':engine-people-prova'
project(':engine-people-prova').projectDir = file('engine-people/prova')

// The gallery. Only exists in this build: a host app includes the engine-* modules by path and
// never reads this file, so nothing an app compiles is affected by it.
include ':sample'
