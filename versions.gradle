// The engine's dependency versions.
//
// Deliberately not a version catalog: the engine is meant to be dropped into an app that already
// has one, and two catalogs in the same build fight over the `libs` accessor. A plain map applied
// from each module's own directory works the same whether the engine is built on its own or as
// part of a host app.
// The host app can lower the SDK levels from its own gradle.properties:
//
//   engine.compileSdk=35
//
// An app on an older AGP cannot host a module that compiles against an API level its plugin has
// never heard of, and being locked out of the engine over one number is an absurd price. minSdk is
// raised rather than replaced: the engine's own floor is a fact about the code, not a preference,
// and a library below its host's floor is an error AGP reports far more clearly than we could.
def hostCompileSdk = project.findProperty('engine.compileSdk')
def hostMinSdk = project.findProperty('engine.minSdk')

ext.engine = [
  version        : '1.0.0',
  compileSdk     : (hostCompileSdk ?: 36) as Integer,
  minSdk         : Math.max(26, (hostMinSdk ?: 26) as Integer),
  javaVersion    : JavaVersion.VERSION_17,
  jvmTarget      : '17',

  agp            : '8.13.2',
  kotlin         : '2.2.20',

  composeBom     : '2026.03.00',
  material3      : '1.5.0-alpha16',
  coreKtx        : '1.18.0',
  lifecycle      : '2.10.0',
  activityCompose: '1.13.0',
  navigation     : '2.9.8',
  datastore      : '1.1.1',
  glance         : '1.1.1',
  coroutines     : '1.8.1',
  serialization  : '1.6.3',

  junit          : '4.13.2',
  coroutinesTest : '1.8.1',
]
